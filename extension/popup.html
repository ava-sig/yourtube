<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YourTube mode</title>
  <style>
    body { width: 220px; margin: 0; padding: 16px; background: #181818; color: #f1f1f1; font: 14px system-ui, sans-serif; }
    h1 { margin: 0 0 12px; font-size: 15px; }
    button { width: 100%; padding: 10px 12px; border: 0; border-radius: 20px; background: #303030; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .7; cursor: wait; }
    p { min-height: 18px; margin: 10px 0 0; color: #aaa; font-size: 12px; }
  </style>
</head>
<body>
  <h1>YourTube network mode</h1>
  <button id="mode" type="button">Loading…</button>
  <p id="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
